name: Daily Instagram Agent (Safe Preview)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  create-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Research broad content topics
        run: python agent/research_topics.py
      - name: Generate visual Reel preview
        run: python agent/main.py
      - name: Save preview video and plan
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview-${{ github.run_number }}
          path: |
            output/reel.mp4
            output/plan.json
            output/topic_research.json
          retention-days: 3
