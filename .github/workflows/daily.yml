name: Daily Instagram Reel Auto Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: instagram-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Research possible topics
        run: python agent/research_topics.py
      - name: Generate vertical Reel
        run: python agent/main.py
      - name: Add compatible silent audio
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/reel.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo -shortest -c:v copy -c:a aac -b:a 128k output/final.mp4
      - name: Validate video before publishing
        run: |
          python - <<'PY'
          import json,subprocess,sys,os
          path="output/final.mp4"
          if not os.path.isfile(path) or os.path.getsize(path)<40000:
              sys.exit("Video missing or suspiciously small: stop before posting")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",path]))
          video=next((s for s in info["streams"] if s.get("codec_type")=="video"),None)
          duration=float(info["format"].get("duration",0))
          if not video or video["width"]!=720 or video["height"]!=1280 or not 5<=duration<=90:
              sys.exit("Video failed 9:16 format/duration check")
          research=json.load(open("output/topic_research.json",encoding="utf8"))
          if all(not x["headlines"] for x in research["topics"]):
              sys.exit("Research unavailable; skip posting rather than repeat blindly")
          print("Video validation passed",duration,"seconds")
          PY
      - name: Upload generated video to public repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,base64,json,urllib.request,time
          repo=os.environ["REPO"]
          path="media/daily-"+os.environ["RUN_ID"]+".mp4"
          content=base64.b64encode(open("output/final.mp4","rb").read()).decode()
          url=f"https://api.github.com/repos/{repo}/contents/{path}"
          body=json.dumps({"message":"Store scheduled Instagram Reel video","content":content,"branch":"main"}).encode()
          req=urllib.request.Request(url,data=body,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=json.load(response)
          print("Video committed:",data["content"]["sha"][:12])
          video_url=f"https://raw.githubusercontent.com/{repo}/main/{path}"
          with open(os.environ["GITHUB_ENV"],"a") as out:out.write("VIDEO_URL="+video_url+"\n")
          time.sleep(15)
          PY
      - name: Publish publicly to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python agent/publish_test.py
      - name: Save research and generation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-agent-report-${{ github.run_number }}
          path: |
            output/plan.json
            output/topic_research.json
          if-no-files-found: ignore
          retention-days: 7
