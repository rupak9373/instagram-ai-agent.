name: Publish One Test Reel (Manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate video
        run: python agent/main.py
      - name: Add compatible silent audio
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/reel.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo -shortest -c:v copy -c:a aac -b:a 128k output/final.mp4
      - name: Upload video to public GitHub repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,base64,json,urllib.request,time
          repo=os.environ["REPO"]
          path="media/test-"+os.environ["RUN_ID"]+".mp4"
          content=base64.b64encode(open("output/final.mp4","rb").read()).decode()
          url=f"https://api.github.com/repos/{repo}/contents/{path}"
          body=json.dumps({"message":"Store authorized test Reel video","content":content,"branch":"main"}).encode()
          req=urllib.request.Request(url,data=body,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=json.load(response)
          sha=data["content"]["sha"]
          print("Video uploaded SHA:",sha[:12])
          # Raw GitHub content is publicly accessible from this public repo.
          video_url=f"https://raw.githubusercontent.com/{repo}/main/{path}"
          with open(os.environ["GITHUB_ENV"],"a") as out:out.write("VIDEO_URL="+video_url+"\n")
          time.sleep(15)
          PY
      - name: Publish Reel publicly on Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python agent/publish_test.py
